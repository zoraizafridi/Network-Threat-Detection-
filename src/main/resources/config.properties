auth.login.maxAttempts=5
auth.login.windowSeconds=300
auth.session.timeoutSeconds=28800
# Hard lifetime from sign-in, which idle activity cannot extend. 0 disables it.
auth.session.absoluteTimeoutSeconds=43200
auth.session.maxAgeSeconds=0
auth.session.secureCookie=false
auth.csrf.enabled=true
# Deployment posture. This build ships with the three accounts above, each of
# which has a hash of its own username, and it says so in a banner at startup.
# Set app.demoMode=false for anything that is not a demo: the server then
# refuses to start while any account still holds a shipped credential. Real
# secrets belong in NTD_ADMIN_PASSWORD, NTD_ANALYST_PASSWORD and
# NTD_VIEWER_PASSWORD rather than in this file. The password rule applies
# wherever a plaintext credential is readable.
app.demoMode=true
auth.password.minLength=12
auth.password.requireClasses=true
# Asking for the password again in front of a consequential action. A
# successful re-entry can be remembered for freshSeconds, where 0 asks every
# time, and repeated failures are throttled like logins.
auth.reauth.enabled=true
auth.reauth.freshSeconds=0
auth.reauth.maxAttempts=5
auth.reauth.windowSeconds=300
# HSTS is only correct when TLS terminates in front of this server.
auth.hsts.enabled=false
auth.hsts.maxAgeSeconds=31536000
# Largest request body accepted; the import route has its own smaller check.
http.maxBodyBytes=8388608
soc.host.id=
dp.max.states=2000000
decay.rate=0
task.cost.server=8
task.cost.workstation=6
task.cost.router=12
task.cost.iot=4
task.days.unpatched.default=0
alerts.buffer.max=500
# Alert quality gate. A repeat inside the window folds into the alert that fired
# first and moves its last-seen, so one fact is one row. A suppressed alert never
# consumes the source cooldown, and the storm cap counts deliveries rather than
# detections. Set maxPerMinute to 0 for no cap.
alerts.dedupe.enabled=true
alerts.dedupe.windowSeconds=60
alerts.dedupe.maxKeys=5000
alerts.minSeverity=LOW
alerts.maxPerMinute=600
# Operator written suppression rules. Blank fields are wildcards; a rule always
# narrows, and a rule that names nothing is refused.
suppression.enabled=true
suppression.rules.file=config/suppression-rules.json
suppression.maxRules=200
flow.enabled=true
flow.idleTimeoutSeconds=30
flow.maxRecords=2000
flow.maxActiveFlows=5000
flow.retentionMinutes=30
flow.api.max=500
flow.udpPorts=53,123,161,1900,500,4500
flow.labels=PORT_SCAN=.*PORT_SCAN.*,BRUTE_FORCE=.*AUTH_FAILED.*,DATA_EXFIL=.*EXFILTRATION.*,DOS_FLOOD=.*DOS_FLOOD.*,NORMAL=.*NORMAL.*
# Threat feed lookup. Off by default; a match decides whether an alert is
# raised, the event decides which attack bucket it lands in. The shipped feed is
# JSON: each entry carries a type (ip, domain or sha256), a value, a category, a
# confidence and an optional expiry. Severity comes from the category and the
# confidence unless the entry states one, and an expired entry never matches. A
# line feed (network label [severity]) is still accepted, so an older file keeps
# working. Reload at runtime with POST /api/intel/reload.
intel.enabled=false
intel.feed=threat-intel.json
intel.defaultSeverity=HIGH
# NDR detectors. Every one of them is off unless enabled, so the default alert
# stream stays exactly what it was before they existed.
detection.beaconing.enabled=false
detection.beaconing.minSamples=4
# Addresses that are allowed to be regular without alerting, comma separated
# (address or CIDR). Empty means every regular conversation is judged.
detection.beaconing.allowlist=
detection.beaconing.jitterTolerance=0.25
detection.beaconing.minIntervalSeconds=5
detection.beaconing.maxIntervalSeconds=900
detection.beaconing.maxTracked=2000
detection.beaconing.cooldownSeconds=300
detection.exfil.enabled=false
detection.exfil.windowSeconds=300
detection.exfil.maxBytes=5000000
detection.exfil.maxTracked=2000
detection.exfil.cooldownSeconds=600
# Destinations that are allowed to receive bulk transfers without alerting,
# comma separated (address or CIDR). Empty means every external destination counts.
detection.exfil.allowlist=
detection.exfil.internalPrefixes=10.,192.168.,172.16.,172.17.,172.18.,172.19.,172.20.,172.21.,172.22.,172.23.,172.24.,172.25.,172.26.,172.27.,172.28.,172.29.,172.30.,172.31.
detection.lateral.enabled=false
detection.lateral.windowSeconds=120
detection.lateral.maxHosts=4
detection.lateral.maxTracked=1000
detection.lateral.cooldownSeconds=300
detection.lateral.adminPorts=22,23,445,3389,5985
# Connection flood detector. Counts connections to one destination inside a window.
detection.flood.enabled=false
detection.flood.windowSeconds=60
detection.flood.maxConnections=100
detection.flood.cooldownSeconds=60
detection.flood.maxTracked=2000
detection.flood.allowlist=
# Flow anomaly model. Off by default; when on, the model learns from the same
# completed flows it scores, so "cold" means it has an opinion about nothing.
ml.enabled=false
ml.k=4
ml.minSamples=60
ml.retrainSeconds=300
ml.anomalyThreshold=0.9
ml.maxTrainFlows=2000
ml.seed=42
ml.alertSeverity=LOW
ml.cooldownSeconds=300
ml.maxTrackedSources=2000
# Training exclusion. A flow that raised an alert is not a sample of normal
# behaviour, so a source/destination pair that alerted inside the window is
# skipped by the trainer. Without this the model learns the attack it just
# reported and stops seeing it as unusual. 0 seconds disables the exclusion.
ml.train.excludeAlerted=true
ml.train.exclusionSeconds=300
ml.train.maxPairs=5000
# Labelled evaluation. The only ground truth available is the label file that
# ships beside an imported capture, so the report is built from replayed flows.
# The sweep is the range of thresholds reported, the chosen point is the one the
# running model uses, and the best point is the highest F1 in the sweep.
ml.eval.sweepStart=0.5
ml.eval.sweepEnd=0.99
ml.eval.sweepStep=0.05
ml.eval.maxRuns=5
ml.eval.maxSamplesPerRun=2000
ml.eval.benignLabels=NORMAL,NORMAL_TYPO,NORMAL_BACKUP,NTP_HEALTH
# Cross-detector correlation. A source that produces several distinct attack
# types inside one window is escalated once, not once per alert. On top of that
# count, ordered kill chains from the rule file below are walked per source; a
# completed chain is escalated as a possible compromise. A missing file falls
# back to the built-in recon to exfiltration chain.
correlation.enabled=false
correlation.minSignals=2
correlation.windowSeconds=600
correlation.cooldownSeconds=600
correlation.maxSources=2000
correlation.escalateSeverity=HIGH
correlation.killChain.file=config/kill-chain.json
# Containment. Actions expire, record who asked, and only change traffic in IPS
# mode. containment.mode is off, ids or ips; when it is absent the older enabled
# and enforce pair decides. An address on the allowlist is never contained, a
# burst above maxPerMinute is refused, and a block that would cut the topology
# in two is refused as well. Set maxPerMinute to 0 for no cap.
containment.mode=off
containment.enabled=false
containment.auto=false
containment.enforce=false
containment.autoMinutes=30
containment.autoSeverity=CRITICAL
containment.minSeverity=LOW
containment.maxDurationMinutes=1440
containment.maxBlocked=500
containment.allowlist=
containment.maxPerMinute=12
containment.partitionCheck=true
# Notifications. The outbox is always populated when enabled; the console, an
# email relay and a webhook are separate channels. Credentials are never read
# from this file: NTD_SMTP_USER, NTD_SMTP_PASSWORD and NTD_WEBHOOK_SECRET come
# from the environment. A webhook must be https unless it points at loopback and
# notifications.allowInsecure is true.
notifications.enabled=false
notifications.minSeverity=HIGH
notifications.maxOutbox=200
notifications.console=true
notifications.webhook.url=
notifications.allowInsecure=false
notifications.maxInFlight=8
notifications.webhook.timeoutMillis=2000
notifications.retries=2
notifications.backoffMillis=500
notifications.breakerThreshold=5
notifications.breakerCooldownSeconds=60
notifications.maxPerHour=120
notifications.cooldownSeconds=30
notifications.maxBodyBytes=8192
notifications.historyMax=200
notifications.redact=true
notifications.email.enabled=false
notifications.email.host=
notifications.email.port=587
notifications.email.from=ntd@localhost
notifications.email.to=
notifications.email.tls=true
notifications.email.timeoutMillis=5000
# Evidence bundles. Off by default; each export writes a directory with the
# records and a manifest of their SHA-256 digests.
forensics.enabled=false
forensics.dir=evidence
forensics.maxFlows=5000
forensics.maxAlerts=5000
# Table exports (GET /api/export/{alerts,events,incidents,flows}?format=csv|json).
# The cap bounds a download the same way the API caps a page.
export.maxRows=5000
# Offline Zeek conn.log import (command line: --import-zeek <file>) and replay
# through the live pipeline (--replay-zeek <file> [--labels <csv>] [--speed N],
# or POST /api/import/zeek). Speed is a clock multiplier: 0 replays as fast as
# the pipeline accepts events, 1 keeps the recorded rhythm, 60 runs a minute of
# capture per second. A single gap longer than import.replay.maxGapMillis is
# compressed to it, so a quiet stretch in a capture does not stall a demo.
zeek.enabled=true
zeek.import.maxFlows=50000
import.replay.maxGapMillis=5000
import.failureStates=S0,REJ,RSTO,RSTR
# Addresses in an imported log that the topology does not know become workstation
# assets so their alerts land somewhere on the map. Capped, because a capture of
# the internet would otherwise replace the sample topology with strangers.
import.unknownHosts.max=500
import.unknownHosts.criticality=1
# Uploaded log text is held in memory, so the endpoint refuses anything larger.
import.request.maxBytes=8388608
import.cancelJoinMillis=2000
# Durable store. Off by default so behaviour is unchanged unless an operator
# asks for it. Every key also accepts an ntd. system property override, for
# example -Dntd.persistence.enabled=true.
persistence.enabled=false
persistence.dir=data
persistence.file=ntd.db
persistence.queueCapacity=5000
persistence.batchSize=200
persistence.flushIntervalMillis=500
persistence.retentionMinutes=1440
persistence.sweepMinutes=5
# How many incidents are read back on start. Alerts come back with them while
# their rows are still inside the retention window.
persistence.restore.incidents=200
# Audit trail of security relevant actions. Rotating the session id on login
# defeats session fixation; it is on unless an operator turns it off.
audit.enabled=true
audit.maxRecords=2000
audit.api.max=200
auth.session.rotateOnLogin=true
stream.network.intervalMillis=250
engine.queue.pollMillis=50
engine.worker.joinMillis=1000
sim.host.meanBytes=512.0
sim.host.stdBytes=64.0
sim.host.eventsPerSecond=5.0
sim.brute.attempts=15
sim.brute.port=22
sim.brute.baseBytes=120
sim.flood.count=40
sim.flood.port=80
sim.flood.baseBytes=400
sim.exfil.chunks=5
sim.exfil.port=443
sim.exfil.baseBytes=1000000
sim.exfil.jitterBytes=500000
sim.portscan.ports=21,22,23,25,53,80,110,135,139,143,443,445,1433,3306,3389,8080
# Noise and unseen variants. Off by default: with noise on, ordinary traffic
# includes backups, retries and high ports, and a share of injected attacks takes
# a shape the rule thresholds were not written for. Both exist so the detectors
# and the model are measured against something other than their own sample.
sim.noise.enabled=false
sim.noise.benignSpikeChance=0.03
sim.noise.benignSpikeBytes=2000000
sim.noise.retryChance=0.05
sim.noise.portSpreadChance=0.10
sim.noise.attackVariantChance=0.25
sim.noise.scanPortOffset=8000
sim.noise.variantBrutePort=3389
sim.noise.variantFloodPort=443

# Benchmarks. --benchmark times each hot path operation per call, throws the
# warm-up round away and reports the mean with the 50th, 95th and 99th
# percentile over bench.rounds rounds. --soak runs the live pipeline for a
# number of seconds at a fixed offered rate and reports latency, queue depth and
# throughput. bench.soak.progressSeconds=0 silences the periodic line.
bench.events=10000
bench.rounds=5
bench.soak.eventsPerSecond=2000
bench.soak.maxQueueDepth=5000
bench.soak.progressSeconds=60
